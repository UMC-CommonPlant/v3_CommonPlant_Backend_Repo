name: Build Dev Image

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME }}
  IMAGE_TAG: sha-${{ github.sha }}
  IMAGE_REPOSITORY: ${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}

jobs:
  build-dev-image:
    name: build-dev-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing SHA image
        id: preflight
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          IMAGE_REF="${IMAGE_REPOSITORY}:${IMAGE_TAG}"

          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

          if ! docker buildx imagetools inspect "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "Image does not exist. Build is required."
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Image tag already exists: ${IMAGE_REF}"

          EXISTING_DIGEST="$(
            docker buildx imagetools inspect \
              --raw "${IMAGE_REF}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"

          LABELS="$(
            docker buildx imagetools inspect "${IMAGE_REF}" \
              --format '{{json .Image.Config.Labels}}'
          )"

          EXISTING_REVISION="$(
            jq -r '."org.opencontainers.image.revision" // empty' \
              <<< "${LABELS}"
          )"

          echo "existing_digest=${EXISTING_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "existing_revision=${EXISTING_REVISION}" >> "$GITHUB_OUTPUT"

          if [[ -z "${EXISTING_REVISION}" ]]; then
            echo "::error::Existing image has no org.opencontainers.image.revision label."
            echo "::error::The immutable SHA tag cannot be verified."
            exit 1
          fi

          if [[ "${EXISTING_REVISION}" != "${EXPECTED_REVISION}" ]]; then
            echo "::error::Immutable SHA tag violation detected."
            echo "::error::Expected revision: ${EXPECTED_REVISION}"
            echo "::error::Existing revision: ${EXISTING_REVISION}"
            exit 1
          fi

          echo "The image already exists and matches github.sha."
          echo "build_required=false" >> "$GITHUB_OUTPUT"
          echo "skip_reason=image-already-exists" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.preflight.outputs.build_required == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        if: steps.preflight.outputs.build_required == 'true'
        run: chmod +x gradlew

      - name: Verify checked-out commit
        if: steps.preflight.outputs.build_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"

          if [[ "${CHECKED_OUT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checked-out commit does not match github.sha."
            echo "::error::Checked out: ${CHECKED_OUT_SHA}"
            echo "::error::Expected:    ${GITHUB_SHA}"
            exit 1
          fi

      # - name: Revalidate merged commit
      #   if: steps.preflight.outputs.build_required == 'true'
      #   run: ./gradlew clean test --no-daemon

      - name: Extract image metadata
        id: metadata
        if: steps.preflight.outputs.build_required == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Build and push image
        id: build
        if: steps.preflight.outputs.build_required == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Action이 반환한 digest 형식 검증
      - name: Validate build digest
        id: build-digest
        if: steps.preflight.outputs.build_required == 'true'
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail

          if [[ ! "${BUILD_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid build digest: ${BUILD_DIGEST}"
            exit 1
          fi

          DIGEST_REF="${IMAGE_REPOSITORY}@${BUILD_DIGEST}"

          echo "Build digest is valid: ${BUILD_DIGEST}"
          echo "Image repository: ${IMAGE_REPOSITORY}"

          echo "build_digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "digest_ref=${DIGEST_REF}" >> "$GITHUB_OUTPUT"

      # GHCR에서 push된 이미지의 manifest 조회
      - name: Fetch pushed image manifest
        id: registry-manifest
        if: steps.preflight.outputs.build_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE_REF="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          RAW_MANIFEST_FILE="${RUNNER_TEMP}/image-manifest.json"

          for attempt in 1 2 3 4 5; do
            echo "Fetching image manifest: attempt ${attempt}/5"

            if docker buildx imagetools inspect \
              --raw "${IMAGE_REF}" > "${RAW_MANIFEST_FILE}"; then
              echo "Image manifest fetched successfully."
              break
            fi

            if [[ "${attempt}" == "5" ]]; then
              echo "::error::Unable to read the pushed image from GHCR."
              echo "::error::Image: ${IMAGE_REF}"
              exit 1
            fi

            sleep 3
          done

          if [[ ! -s "${RAW_MANIFEST_FILE}" ]]; then
            echo "::error::Fetched manifest file is empty."
            exit 1
          fi

          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "manifest_file=${RAW_MANIFEST_FILE}" >> "$GITHUB_OUTPUT"

      # Build digest와 Registry digest 비교
      - name: Compare build and registry digests
        id: digest-compare
        if: steps.preflight.outputs.build_required == 'true'
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build-digest.outputs.build_digest }}
          DIGEST_REF: ${{ steps.build-digest.outputs.digest_ref }}
          RAW_MANIFEST_FILE: ${{ steps.registry-manifest.outputs.manifest_file }}
        run: |
          set -Eeuo pipefail

          REGISTRY_DIGEST="$(
            sha256sum "${RAW_MANIFEST_FILE}" \
              | awk '{print "sha256:" $1}'
          )"

          if [[ ! "${REGISTRY_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid registry digest: ${REGISTRY_DIGEST}"
            exit 1
          fi

          if [[ "${BUILD_DIGEST}" != "${REGISTRY_DIGEST}" ]]; then
            echo "::error::Digest mismatch."
            echo "::error::Build digest:    ${BUILD_DIGEST}"
            echo "::error::Registry digest: ${REGISTRY_DIGEST}"
            exit 1
          fi

          echo "Build and registry digests match."
          echo "Digest: ${BUILD_DIGEST}"

          echo "build_digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "registry_digest=${REGISTRY_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest_ref=${DIGEST_REF}" >> "$GITHUB_OUTPUT"

      # Digest reference를 사용한 실제 Pull 검증
      - name: Verify image by digest pull
        id: digest-pull
        if: steps.preflight.outputs.build_required == 'true'
        shell: bash
        env:
          DIGEST_REF: ${{ steps.digest-compare.outputs.digest_ref }}
        run: |
          set -Eeuo pipefail

          echo "Pulling immutable image reference:"
          echo "${DIGEST_REF}"

          docker pull "${DIGEST_REF}"

          echo "Image is accessible by digest."