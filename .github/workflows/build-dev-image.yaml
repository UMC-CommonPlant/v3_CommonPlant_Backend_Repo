name: Build Dev Image

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-dev-image:
    name: build-dev-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@실제_40자리_SHA
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@실제_40자리_SHA

      - name: Log in to GHCR
        uses: docker/login-action@실제_40자리_SHA
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing SHA image
        id: preflight
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          
          if ! docker buildx imagetools inspect "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "Image does not exist. Build is required."
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "Image tag already exists: ${IMAGE_REF}"
          
          EXISTING_DIGEST="$(
            docker buildx imagetools inspect \
              --raw "${IMAGE_REF}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"
          
          LABELS="$(
            docker buildx imagetools inspect "${IMAGE_REF}" \
              --format '{{json .Image.Config.Labels}}'
          )"
          
          EXISTING_REVISION="$(
            jq -r '."org.opencontainers.image.revision" // empty' \
              <<< "${LABELS}"
          )"
          
          echo "existing_digest=${EXISTING_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "existing_revision=${EXISTING_REVISION}" >> "$GITHUB_OUTPUT"
          
          if [[ -z "${EXISTING_REVISION}" ]]; then
            echo "::error::Existing image has no org.opencontainers.image.revision label."
            echo "::error::The immutable SHA tag cannot be verified."
            exit 1
          fi
          
          if [[ "${EXISTING_REVISION}" != "${EXPECTED_REVISION}" ]]; then
            echo "::error::Immutable SHA tag violation detected."
            echo "::error::Expected revision: ${EXPECTED_REVISION}"
            echo "::error::Existing revision: ${EXISTING_REVISION}"
            exit 1
          fi
          
          echo "The image already exists and matches github.sha."
          echo "build_required=false" >> "$GITHUB_OUTPUT"
          echo "skip_reason=image-already-exists" >> "$GITHUB_OUTPUT"