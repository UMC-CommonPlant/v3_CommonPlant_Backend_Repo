name: Set up Kargo CLI
description: tailnet에 접속하고, homelab Kargo 서버와 같은 버전의 kargo CLI를 설치해 checksum을 검증한다.

inputs:
  tailscale-oauth-client-id:
    description: tag:ci 노드를 만드는 Tailscale OAuth client ID
    required: true
  tailscale-oauth-secret:
    description: Tailscale OAuth client secret
    required: true
  version:
    description: Kargo CLI 버전 (서버와 맞춘다)
    required: false
    default: v1.11.0
  sha256:
    description: kargo-linux-amd64 바이너리의 sha256
    required: true

runs:
  using: composite
  steps:
    # Kargo API는 tailnet에서만 열린다. job 동안만 임시 노드(tag:ci)로 접속한다.
    - name: Connect to Tailscale
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret: ${{ inputs.tailscale-oauth-secret }}
        tags: tag:ci

    - name: Install kargo CLI
      shell: bash
      env:
        KARGO_VERSION: ${{ inputs.version }}
        KARGO_SHA256: ${{ inputs.sha256 }}
      run: |
        set -Eeuo pipefail

        if [[ ! "${KARGO_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::KARGO_CLI_SHA256 변수가 비어 있거나 형식이 다릅니다."
          exit 1
        fi

        BIN_DIR="${RUNNER_TEMP}/kargo-bin"
        mkdir -p "${BIN_DIR}"
        curl -fsSL -o "${BIN_DIR}/kargo" \
          "https://github.com/akuity/kargo/releases/download/${KARGO_VERSION}/kargo-linux-amd64"
        echo "${KARGO_SHA256}  ${BIN_DIR}/kargo" | sha256sum -c -
        chmod +x "${BIN_DIR}/kargo"
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"
        "${BIN_DIR}/kargo" version --client
