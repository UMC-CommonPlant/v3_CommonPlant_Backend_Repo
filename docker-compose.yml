services:
  db:
    image: postgres:15
    container_name: common-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: commondb
      POSTGRES_USER: commonuser
      POSTGRES_PASSWORD: commonpass
      TZ: Asia/Seoul
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: common-garage
    ports:
      - "3900:3900"
      - "3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET_NAME:-commonplant-local}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  garage-init:
    image: dxflrs/garage:v2.3.0
    container_name: common-garage-init
    network_mode: "service:garage"
    depends_on:
      garage:
        condition: service_healthy
    command:
      - /garage
      - bucket
      - website
      - --allow
      - ${GARAGE_BUCKET_NAME:-commonplant-local}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
    restart: "no"

  garage-public:
    image: nginx:1.27-alpine
    container_name: common-garage-public
    depends_on:
      garage-init:
        condition: service_completed_successfully
    ports:
      - "3902:80"
    environment:
      GARAGE_BUCKET_NAME: ${GARAGE_BUCKET_NAME:-commonplant-local}
    volumes:
      - ./garage-public.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: always

volumes:
  garage_meta:
  garage_data:
