services:
  db:
    image: postgres:15
    container_name: common-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: commondb
      POSTGRES_USER: commonuser
      POSTGRES_PASSWORD: commonpass
      TZ: Asia/Seoul
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: common-garage
    ports:
      - "3900:3900"
      - "3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET_NAME:-commonplant-local}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  garage_meta:
  garage_data:
