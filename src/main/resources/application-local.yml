# [local] 프로필: Docker PostgreSQL 사용
spring:
  config:
    activate:
      on-profile: local

  jwt:
    secret: ${JWT_SECRET}             # 256-bit 이상 랜덤 문자열 (환경변수)

  datasource:
    url: jdbc:postgresql://localhost:5432/commondb
    driver-class-name: org.postgresql.Driver
    username: commonuser
    password: commonpass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true